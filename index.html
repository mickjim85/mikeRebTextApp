<!DOCTYPE html>

    <head>
        <title>M&R</title>
        <link href="style.css" rel="stylesheet"/>

        <!-- Optimises the display for device screen -->
        <meta name="viewport" content="width=device-width, initial-scale=1" />


        <!-- link to favicons  -->
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">

        <!-- link to google fonts  -->
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap');
        </style>
    </head>

    <body>
        <div class="card">
        <header>
            <h1>
                <span id="Michael">Michael</span> & 
                <span id="Rebecca">Rebecca</span>
            </h1>
            <p>Our first own and first App, Our Text App</p>
        </header>

        <main>
            <div id="image-to-display">
                <img class="image" src="/images/us/5.jpg" alt="picture of Michael and Rebecca"/>
            </div>
            <div class="input-box">
                <input minlength="1" maxlength="70" id="input-box" type="text" placeholder="write something..."/>
                <button id="insert-btn">Insert Text</button>
            </div>

            <div class="inputs-div">
                <ul  class="text-inputs" id="items-list">
                </ul>
            </div>

        </main>



        <script src="script.js" type="module"></script>
        </div>
        <footer>
            <p>Made by Michael</p>
            <p>Made for Rebecca on her Birthday</p>
            <p>8th September 2026</p>
        </footer>


    </body>
</html>
