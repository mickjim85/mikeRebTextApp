<!DOCTYPE html>

    <head>
        <title>M&R</title>
        <link href="style.css" rel="stylesheet"/>

        <!-- Optimises the display for device screen -->
        <meta name="viewport" content="width=device-width, initial-scale=1" />


        <!-- link to favicons  -->
        <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
        <link rel="manifest" href="site.webmanifest">

        <!-- link to google fonts  -->
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap');
        </style>
    </head>

    <body>
        <div class="card">
        <header>
            <h1>
                <span class="michael" id="Michael">Michael</span> <span class="and">&</span><br>
                <span class="rebecca" id="Rebecca">Rebecca</span>
            </h1>
            <p><span class="hearts">&#x2764</span> Our first own App <span class="hearts">&#x2764</span></p>
        </header>

        <main>
            <div id="image-to-display">
                <img class="image border" src="images/MandR.png" alt="picture of Michael and Rebecca"/>
            </div>
            <div class="input-box">
                <input class="bounce-title" minlength="1" maxlength="70" id="input-box" type="text" placeholder="Write something for us ❤️"/>
                <button id="insert-btn">＋ Add to our Notes</button>
            </div>

            <div class="inputs-div">
                <ul  class="text-inputs" id="items-list">
                </ul>
            </div>

        </main>



        <script src="script.js" type="module"></script>
        </div>
        <footer>
            <div>Made with ❤️ by Michael</div>
            <div class="footer-sub">For Rebecca — 8 September 2026</div>
        </footer>

    </body>
</html>
